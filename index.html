<!DOCTYPE html>
<head>
  <title>MashUp Test</title>
</head>
<body>
  <h1>MashUp Test</h1>
   <div>
    <p>Account Technical ID: <span id="accountIdDisplay">‑</span></p>
    <button id="openBtn">Send OpenObject Event</button>
  </div>

  <hr>

  <div>
    <h2>Send Custom Message</h2>
    <label for="customMessage">Enter message as JSON:</label>
    <textarea id="customMessage">
{
  "type": "OpenObject",
  "entityType": "Account",
  "entityId": "1234567890"
}
    </textarea>
    <button id="sendCustomBtn">Send Custom Message</button>
    <p><strong>Example:</strong></p>
    <code>{ "type": "Refresh", "entityType": "Quote" }</code>
  </div>

  <script>
    // Helper: read query param
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    const accountId = getParam('accountId');
    document.getElementById('accountIdDisplay').textContent = accountId || '(missing)';

    document.getElementById('openBtn').addEventListener('click', () => {
      if (!accountId) {
        alert('No accountId parameter passed.');
        return;
      }

      const eventPayload = {
        type: 'OpenObject', // standard event type
        entityType: 'Account',
        entityId: accountId
      };

      // posting to parent frame
      window.parent.postMessage(eventPayload, '*');
      console.log('Posted OpenObject', eventPayload);
    });

    // listen to messages from parent if needed
    window.addEventListener('message', (msg) => {
      console.log('Received message from parent:', msg.data);
      // TODO: handle if any responses come from SAP UI
    });

    // Custom message sender
    document.getElementById('sendCustomBtn').addEventListener('click', () => {
      const input = document.getElementById('customMessage').value;

      try {
        const parsed = JSON.parse(input);
        window.parent.postMessage(parsed, '*');
        console.log('Posted custom message:', parsed);
      } catch (e) {
        alert('Invalid JSON. Please check your input.');
        console.error('JSON parsing error:', e);
      }
    });
  </script>
</body>
</html>
